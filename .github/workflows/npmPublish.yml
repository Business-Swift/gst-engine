name: Auto-Deploy to npm

# Choose when this runs. Running on a published release is highly recommended 
# for teams so that random pushes to main don't accidentally publish packages.
on:
  release:
    types: [published] 

jobs:
  publish:
    runs-on: ubuntu-latest
    
    # CRITICAL: This allows GitHub to generate the OIDC token to authenticate with npm
    permissions:
      contents: read
      id-token: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Node.js and specify the npm registry
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project (If applicable)
        run: npm run build

      # Notice there is NO secret token provided here. 
      # npm CLI automatically detects the OIDC environment and uses it.
      - name: Publish to npm
        run: npm publish --access public
